
name: Build SmartClick

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android ARM64
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64
          sdk: latest

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: SmartClick-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
